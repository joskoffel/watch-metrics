name: WatchMetrics
options:
  developmentLanguage: en
  bundleIdPrefix: com.watchmetrics
  deploymentTarget:
    watchOS: "10.0"
packages:
  MetricsCore:
    path: ..
targets:
  WatchMetrics:
    type: application
    platform: watchOS
    sources:
      - path: HealthKitDiagnostics
    dependencies:
      - package: MetricsCore
        products:
          - MetricsCore
          - WatchMetricsSupport
      - target: WatchMetricsWidgetExtension
        embed: true
    entitlements:
      path: HealthKitDiagnostics/WatchMetrics.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchmetrics.WatchMetrics
        PRODUCT_NAME: WatchMetrics
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Watch Metrics"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Watch Metrics reads sleep, heart, and blood oxygen data to create your personal daily overview."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: "XXRA2Z8LT5"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_TESTABILITY: NO

  # Minimal static complication (roadmap section 11): claims a watch-face
  # slot so the app gets a more generous background-refresh budget for
  # BriefScheduler — no HealthKit access, no App Group, no live data.
  WatchMetricsWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: HealthKitDiagnosticsWidget
    info:
      path: HealthKitDiagnosticsWidget/Info.plist
      properties:
        CFBundleDisplayName: Watch Metrics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchmetrics.WatchMetrics.Widget
        PRODUCT_NAME: WatchMetricsWidgetExtension
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: "XXRA2Z8LT5"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_TESTABILITY: NO

  WatchMetricsTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: HealthKitDiagnosticsTests
    dependencies:
      - target: WatchMetrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchmetrics.WatchMetrics.Tests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "XXRA2Z8LT5"
        CODE_SIGN_STYLE: Automatic
