name: WatchMetrics
options:
  bundleIdPrefix: com.watchmetrics
  deploymentTarget:
    watchOS: "10.0"
packages:
  MetricsCore:
    path: ..
targets:
  WatchMetrics:
    type: application
    platform: watchOS
    sources:
      - path: HealthKitDiagnostics
    dependencies:
      - package: MetricsCore
        products:
          - MetricsCore
          - WatchMetricsSupport
      - target: WatchMetricsWidgetExtension
        embed: true
    entitlements:
      path: HealthKitDiagnostics/WatchMetrics.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchmetrics.WatchMetrics
        PRODUCT_NAME: WatchMetrics
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Watch Metrics"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Watch Metrics číta údaje o spánku, srdci a okysličení, aby vám zobrazil osobný denný prehľad."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Watch Metrics používa približnú polohu pre voliteľný ranný riadok s počasím."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Watch Metrics môže na pozadí použiť poslednú známu približnú polohu pre voliteľný ranný riadok s počasím."
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "XXRA2Z8LT5"
        CODE_SIGN_STYLE: Automatic

  # Minimal static complication (roadmap section 11): claims a watch-face
  # slot so the app gets a more generous background-refresh budget for
  # BriefScheduler — no HealthKit access, no App Group, no live data.
  WatchMetricsWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: HealthKitDiagnosticsWidget
    info:
      path: HealthKitDiagnosticsWidget/Info.plist
      properties:
        CFBundleDisplayName: Watch Metrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchmetrics.WatchMetrics.Widget
        PRODUCT_NAME: WatchMetricsWidgetExtension
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "XXRA2Z8LT5"
        CODE_SIGN_STYLE: Automatic
